name: Build and contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew build
      - run: python3 tools/validate_config.py docs/examples/index.json
      - run: python3 tools/package_manifest.py
      - name: Check benchmark execution
        run: python3 benchmarks/run_jmh.py --quick --output benchmarks/results/ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages-and-contracts
          path: |
            dist/
            **/build/**/test-results/test/
            benchmarks/results/ci-smoke/*.json
            benchmarks/results/ci-smoke/*.log
